{% extends "base.html" %}
{% load ui %}
{% block body %}
<div class="flex min-h-full flex-col justify-center bg-gradient-to-b from-indigo-50/70 to-slate-50 px-4 py-12">
  <div class="mx-auto w-full max-w-sm">
    <div class="flex items-center justify-center gap-2.5">
      <span class="grid size-10 place-items-center rounded-xl bg-indigo-600 text-white shadow-sm">{% icon "trending" "size-6" %}</span>
      <span class="text-2xl font-semibold tracking-tight">Ledgerly</span>
    </div>
    <h1 class="mt-8 text-center text-xl font-semibold tracking-tight">{% block heading %}{% endblock %}</h1>
    <p class="mt-1 text-center text-sm text-slate-500">{% block subheading %}{% endblock %}</p>
    <div class="card mt-6 p-6">
      {% block form %}{% endblock %}
    </div>
    <p class="mt-6 text-center text-sm text-slate-500">{% block footer %}{% endblock %}</p>
  </div>
</div>
{% endblock %}
