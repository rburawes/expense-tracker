{% comment %}Modal shell. Include with: title, subtitle (optional), body_template.{% endcomment %}
<div x-data="{ open: false }" x-init="$nextTick(() => { open = true; $nextTick(() => $el.querySelector('[autofocus], input:not([type=hidden]), button[type=submit]')?.focus()) })"
     @close-modal.window="open = false; setTimeout(() => $el.remove(), 200)"
     @keydown.escape.window="$dispatch('close-modal')"
     class="relative z-50" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div x-show="open" x-transition.opacity.duration.200ms class="fixed inset-0 bg-slate-900/40 backdrop-blur-[2px]"></div>
  <div class="fixed inset-0 overflow-y-auto">
    <div class="flex min-h-full items-end justify-center sm:items-center sm:p-4" @mousedown.self="$dispatch('close-modal')">
      <div x-show="open"
           x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-6 sm:translate-y-0 sm:scale-95"
           x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
           x-transition:leave="transition ease-in duration-150" x-transition:leave-end="opacity-0 translate-y-6 sm:translate-y-0 sm:scale-95"
           class="w-full rounded-t-2xl bg-white shadow-xl ring-1 ring-slate-200 sm:max-w-lg sm:rounded-2xl">
        <div class="flex items-start justify-between gap-4 border-b border-slate-100 px-5 py-4 sm:px-6">
          <div>
            <h2 id="modal-title" class="text-base font-semibold text-slate-900">{{ title }}</h2>
            {% if subtitle %}<p class="mt-0.5 text-sm text-slate-500">{{ subtitle }}</p>{% endif %}
          </div>
          <button type="button" class="btn-ghost -mr-1.5" @click="$dispatch('close-modal')"><span class="sr-only">Close</span>{% load ui %}{% icon "x" "size-5" %}</button>
        </div>
        {% include body_template %}
      </div>
    </div>
  </div>
</div>
