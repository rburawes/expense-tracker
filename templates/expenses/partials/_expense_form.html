{% load crispy_forms_tags %}
<form method="post" novalidate
      action="{% if expense %}{% url 'expenses:update' expense.pk %}{% else %}{% url 'expenses:create' %}{% endif %}"
      hx-post="{% if expense %}{% url 'expenses:update' expense.pk %}{% else %}{% url 'expenses:create' %}{% endif %}"
      hx-target="this" hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]">
  {% csrf_token %}
  <div class="px-5 pt-5 sm:px-6">
    {% if form.errors %}
    <div class="mb-4 flex items-start gap-2 rounded-lg bg-rose-50 p-3 text-sm text-rose-700 ring-1 ring-inset ring-rose-200" role="alert">
      <span class="mt-px">!</span><p>Please fix the highlighted fields.</p>
    </div>
    {% endif %}
    {% crispy form %}
  </div>
  <div class="flex flex-col-reverse gap-2 border-t border-slate-100 bg-slate-50/60 px-5 py-4 sm:flex-row sm:justify-end sm:px-6 rounded-b-2xl">
    {% if request.htmx %}
      <button type="button" class="btn-secondary" @click="$dispatch('close-modal')">Cancel</button>
    {% else %}
      <a href="{% url 'expenses:list' %}" class="btn-secondary">Cancel</a>
    {% endif %}
    <button type="submit" class="btn-primary min-w-32">
      <span class="spinner htmx-indicator"></span>
      {% if expense %}Save changes{% else %}Add expense{% endif %}
    </button>
  </div>
</form>
